name: Sync official site email
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add email sync script to homepage
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="site-email.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('index.html sem </body>')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit homepage patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m '[skip ci] Sync official company email'
          git push
