name: Apply professional profiles integration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing frontend files without rewriting them
        shell: python
        run: |
          from pathlib import Path
          import re

          # Public homepage: add section immediately before the existing highlights section.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'id="profissionaisGrid"' not in s:
              marker='<section class="s destaques">'
              section='''<section class="s profissionais" id="profissionais">\n  <div class="sh rev"><span class="tag">A Nossa Equipa</span><h2 class="h2">Profissionais que <em>cuidam de si</em></h2><p class="desc">Conheça a nossa equipa, as áreas de actuação e os horários de atendimento.</p></div>\n  <div id="profissionaisGrid" class="profissionais-grid"><div class="prof-loading">A carregar a nossa equipa…</div></div>\n</section>\n\n'''
              if marker not in s: raise SystemExit('Não encontrei o ponto seguro de inserção no index.html')
              s=s.replace(marker,section+marker,1)
          if 'profissionais.js' not in s:
              s=s.replace('<script src="main.js"></script>','<script src="main.js"></script>\n<script src="profissionais.js"></script>',1)
          p.write_text(s,encoding='utf-8')

          # Keep the existing design system; only append the new component styles.
          p=Path('style.css'); s=p.read_text(encoding='utf-8')
          if '/* PROFISSIONAIS XAQ */' not in s:
              s+='''\n\n/* PROFISSIONAIS XAQ */\n.profissionais{background:var(--off,#FAF8F3)}\n.profissionais-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-top:36px}\n.prof-card{background:#fff;border:1px solid rgba(0,48,112,.10);border-radius:24px;overflow:hidden;box-shadow:0 12px 35px rgba(0,48,112,.07);display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}\n.prof-card:hover{transform:translateY(-4px);box-shadow:0 18px 42px rgba(0,48,112,.11)}\n.prof-photo-wrap{aspect-ratio:4/3;background:linear-gradient(135deg,#eaf1f7,#f4f8f5);overflow:hidden}\n.prof-photo{width:100%;height:100%;object-fit:cover;display:block}\n.prof-body{padding:24px}\n.prof-name{font-size:1.22rem;font-weight:800;color:#003070;margin:0 0 4px}\n.prof-role{font-size:.8rem;font-weight:700;color:#1B5E3F;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}\n.prof-area{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:rgba(27,94,63,.09);color:#1B5E3F;font-size:.75rem;font-weight:700;margin-bottom:14px}\n.prof-bio,.prof-desc{color:#5f6874;font-size:.88rem;line-height:1.65;margin:0 0 12px}\n.prof-hours{border-top:1px solid #edf0f2;margin-top:16px;padding-top:16px}\n.prof-hours-title{font-size:.72rem;font-weight:800;color:#003070;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}\n.prof-hours-row{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;padding:4px 0;color:#59636d}\n.prof-hours-row strong{color:#1B5E3F;font-weight:700}\n.prof-cta{display:inline-flex;align-items:center;justify-content:center;margin-top:16px;width:100%;padding:12px 16px;border-radius:14px;background:#1B5E3F;color:#fff;text-decoration:none;font-weight:800;border:0;cursor:pointer}\n.prof-empty,.prof-loading{grid-column:1/-1;text-align:center;padding:32px;color:#68727d}\n.prof-adm-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:24px 0}.prof-adm-head h2{margin:5px 0;color:#003070}.prof-adm-head p{margin:0;color:#68727d}.prof-adm-list{display:grid;gap:12px}.prof-adm-card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #e7ecef;border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(0,48,112,.05)}.prof-adm-avatar{width:64px;height:64px;border-radius:16px;overflow:hidden;background:#f1f5f7;display:grid;place-items:center;flex:none}.prof-adm-avatar img{width:100%;height:100%;object-fit:cover}.prof-adm-info{display:flex;flex-direction:column;gap:4px;flex:1}.prof-adm-info strong{color:#003070}.prof-adm-info span{color:#1B5E3F;font-size:.82rem}.prof-adm-info small{color:#7b858d}.prof-adm-actions{display:flex;gap:8px}.prof-adm-actions button,.ghost-btn{border:1px solid #dce3e7;background:#fff;color:#003070;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}.prof-adm-actions .danger{color:#b42318}.prof-adm-form{background:#fff;border:1px solid #e3e9ed;border-radius:22px;padding:22px;margin:20px 0;box-shadow:0 10px 30px rgba(0,48,112,.06)}.prof-adm-form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.prof-adm-form-head h3{margin:4px 0;color:#003070}.prof-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.prof-form-grid label{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:700;color:#3e4a54}.prof-form-grid .full{grid-column:1/-1}.prof-form-grid input,.prof-form-grid textarea{font:inherit;font-weight:400;border:1px solid #dce3e7;border-radius:11px;padding:10px;background:#fff}.prof-form-grid textarea{resize:vertical}.prof-form-grid small{font-weight:400;color:#7b858d}.prof-form-grid .check{justify-content:center;flex-direction:row;align-items:center}.prof-hours-edit{margin-top:22px;border-top:1px solid #edf0f2;padding-top:18px}.prof-hours-edit h4{margin:0 0 12px;color:#003070}.hour-row{display:grid;grid-template-columns:1.5fr 1fr auto 1fr;gap:10px;align-items:center;padding:7px 0;font-size:.82rem}.hour-row label{font-weight:600}.hour-row input[type=time]{border:1px solid #dce3e7;border-radius:9px;padding:7px}.prof-form-actions{display:flex;gap:10px;margin-top:20px}@media(max-width:650px){.prof-adm-head{align-items:flex-start;flex-direction:column}.prof-form-grid{grid-template-columns:1fr}.prof-form-grid .full{grid-column:auto}.hour-row{grid-template-columns:1fr 1fr 1fr}.hour-row label{grid-column:1/-1}}\n'''
          p.write_text(s,encoding='utf-8')

          # Admin: load the separate manager after the current admin.js so existing code stays untouched.
          p=Path('admin.js'); s=p.read_text(encoding='utf-8')
          marker='/* PROFISSIONAIS ADMIN LOADER */'
          if marker not in s:
              s += '''\n\n/* PROFISSIONAIS ADMIN LOADER */\n(function(){const x=document.createElement('script');x.src='profissionais-admin.js';x.defer=true;document.head.appendChild(x);})();\n'''
          p.write_text(s,encoding='utf-8')

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css admin.js
          git diff --cached --quiet || git commit -m '[skip ci] Integrate professional profiles'
          git push
